{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Drivers</h3>
  <a class="btn btn-sm btn-success" href="{{ url_for('drivers.driver_create') }}">New</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th><th>Name</th><th>Phone</th><th>License</th><th>Status</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for d in drivers %}
      <tr>
        <td>{{ d.id }}</td>
        <td>{{ d.name }}</td>
        <td>{{ d.phone or '' }}</td>
        <td>{{ d.license_no or '' }}</td>
        <td>{{ d.status }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('drivers.driver_edit', driver_id=d.id) }}">Edit</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
