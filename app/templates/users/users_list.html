{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Users</h3>
  <a class="btn btn-sm btn-success" href="{{ url_for('users.user_create') }}">New</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th><th>Username</th><th>Role</th><th>Active</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for u in users %}
      <tr>
        <td>{{ u.id }}</td>
        <td>{{ u.username }}</td>
        <td>{{ u.role.value }}</td>
        <td>{{ 'yes' if u.is_active else 'no' }}</td>
        <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('users.user_edit', user_id=u.id) }}">Edit</a></td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
