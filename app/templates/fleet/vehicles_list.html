{% extends 'base.html' %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h3>Vehicles</h3>
  <a class="btn btn-sm btn-success" href="{{ url_for('fleet.vehicle_create') }}">New</a>
</div>
<table class="table table-striped">
  <thead>
    <tr>
      <th>ID</th><th>Plate</th><th>Make/Model</th><th>Year</th><th>Status</th><th></th>
    </tr>
  </thead>
  <tbody>
    {% for v in vehicles %}
      <tr>
        <td>{{ v.id }}</td>
        <td>{{ v.plate_no }}</td>
        <td>{{ v.make_model }}</td>
        <td>{{ v.year or '' }}</td>
        <td>{{ v.status }}</td>
        <td>
          {% if current_user.role.value in ['super_admin','admin'] %}
            <a class="btn btn-sm btn-outline-primary" href="{{ url_for('fleet.vehicle_edit', vehicle_id=v.id) }}">Edit</a>
          {% endif %}
        </td>
      </tr>
    {% endfor %}
  </tbody>
</table>
{% endblock %}
